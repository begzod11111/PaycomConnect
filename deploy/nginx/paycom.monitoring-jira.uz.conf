# Reverse proxy for PaycomConnect on a dedicated subdomain.
#
# Install:
#   sudo cp deploy/nginx/paycom.monitoring-jira.uz.conf \
#       /etc/nginx/sites-available/paycom.monitoring-jira.uz
#   sudo ln -s /etc/nginx/sites-available/paycom.monitoring-jira.uz \
#       /etc/nginx/sites-enabled/paycom.monitoring-jira.uz
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites (see docs/deployment.md):
#   1. DNS A record: paycom.monitoring-jira.uz -> 35.223.106.176
#   2. TLS cert that covers this name, e.g. expand the existing cert:
#        sudo certbot --nginx -d monitoring-jira.uz \
#            -d tamada.monitoring-jira.uz -d paycom.monitoring-jira.uz
#
# The upstream app listens on 127.0.0.1:9010 (see docker-compose.yml) and
# serves everything under the /api prefix (global prefix set in src/main.ts).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream paycomconnect_backend {
    server 127.0.0.1:9010;
    keepalive 32;
}

server {
    listen 80;
    server_name paycom.monitoring-jira.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name paycom.monitoring-jira.uz;

    ssl_certificate /etc/letsencrypt/live/monitoring-jira.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring-jira.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/paycom.access.log;
    error_log  /var/log/nginx/paycom.error.log warn;

    # Telegram/Slack webhooks may carry media.
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location = /health {
        proxy_pass http://paycomconnect_backend/api/health;
        access_log off;
    }

    location / {
        proxy_pass http://paycomconnect_backend;
    }
}
